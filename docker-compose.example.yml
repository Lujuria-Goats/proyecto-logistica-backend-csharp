version: '3.8'

services:
  # API Backend (.NET)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_backend
    restart: always
    ports:
      - "8080:8080" # Expone el puerto de la API al host
    depends_on:
      - db
    environment:
      # --- IMPORTANTE: Reemplaza estos valores con tus secretos reales en tu archivo docker-compose.yml ---
      
      # Base de Datos (apunta al servicio 'db' de este archivo)
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=postgres;Username=root;Password=TU_PASSWORD_DE_POSTGRES
      
      # JSON Web Tokens (Usa una clave larga y segura)
      - Jwt__Key=TU_CLAVE_SECRETA_PARA_JWT_DE_MAS_DE_32_CARACTERES
      - Jwt__Issuer=ApexVisionAPI
      - Jwt__Audience=ApexVisionUsers
      - Jwt__ExpirationMinutes=1440 # 24 horas
      
      # Cloudinary
      - Cloudinary__CloudName=TU_CLOUDINARY_CLOUD_NAME
      - Cloudinary__ApiKey=TU_CLOUDINARY_API_KEY
      - Cloudinary__ApiSecret=TU_CLOUDINARY_API_SECRET
      
      # RabbitMQ (apunta a tu dominio existente)
      - RabbitMQ__HostName=rabbitmq.lujuria.crudzaso.com
      - RabbitMQ__UserName=TU_USUARIO_DE_RABBITMQ
      - RabbitMQ__Password=TU_PASSWORD_DE_RABBITMQ
      
      # Azure Computer Vision
      - AZURE_VISION_ENDPOINT=TU_AZURE_VISION_ENDPOINT
      - AZURE_VISION_KEY=TU_AZURE_VISION_KEY
      
      # Entorno de ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

  # Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: apex_db
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=TU_PASSWORD_DE_POSTGRES
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432" # Expone el puerto de la BD al host (útil para DBeaver)
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
