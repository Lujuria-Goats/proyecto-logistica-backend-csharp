version: '3.8'

services:
  # API Backend (.NET 8)
  apex-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # ============================================
      # DATABASE CONFIGURATION
      # ============================================
      # External PostgreSQL Database (replace with your database IP/host)
      - ConnectionStrings__DefaultConnection=Host=YOUR_DB_HOST;Port=5432;Database=postgres;Username=YOUR_DB_USER;Password=YOUR_DB_PASSWORD
      
      # ============================================
      # JWT AUTHENTICATION
      # ============================================
      - Jwt__Key=YOUR_SECRET_KEY_AT_LEAST_32_CHARACTERS_LONG
      - Jwt__Issuer=ApexVision
      - Jwt__Audience=ApexVisionUsers
      - Jwt__ExpirationMinutes=1440
      
      # ============================================
      # CLOUDINARY (Image Storage)
      # ============================================
      - Cloudinary__CloudName=YOUR_CLOUDINARY_CLOUD_NAME
      - Cloudinary__ApiKey=YOUR_CLOUDINARY_API_KEY
      - Cloudinary__ApiSecret=YOUR_CLOUDINARY_API_SECRET
      
      # ============================================
      # RABBITMQ (Message Queue)
      # ============================================
      # External RabbitMQ Server (replace with your RabbitMQ host)
      - RabbitMQ__HostName=rabbitmq.apexvision.crudzaso.com
      - RabbitMQ__UserName=YOUR_RABBITMQ_USER
      - RabbitMQ__Password=YOUR_RABBITMQ_PASSWORD
      
      # ============================================
      # AZURE COMPUTER VISION (AI)
      # ============================================
      - AzureVisionSettings__Endpoint=https://YOUR_AZURE_ENDPOINT.cognitiveservices.azure.com/
      - AzureVisionSettings__Key=YOUR_AZURE_VISION_KEY
      
      # ============================================
      # ASP.NET CORE ENVIRONMENT
      # ============================================
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    
    networks:
      - apex-network
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  apex-network:
    driver: bridge
