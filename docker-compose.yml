version: '3.8'

services:
  # ================================================
  # 🗄️ BASE DE DATOS POSTGRESQL
  # ================================================
  db:
    image: postgres:15-alpine
    container_name: apex_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: xbI4PLOvlMwRwHn7SdZXHivFOZwc99
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # 🐰 RABBITMQ
  # ================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: apex_rabbit
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: Kj9#mP2$qR5@vX8&
    ports:
      - "5672:5672"      # Puerto AMQP
      - "15672:15672"    # Puerto Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - apex-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # 🦅 APEX VISION - BACKEND .NET
  # ================================================
  apex-backend:
    image: tu-usuario/apex-vision:latest
    # build:
    #   context: ./ApexVision.Backend
    #   dockerfile: Dockerfile
    
    container_name: apex_backend
    
    environment:
      # BASE DE DATOS - IMPORTANTE: Host=db (nombre del servicio, no localhost)
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=postgres;Username=root;Password=xbI4PLOvlMwRwHn7SdZXHivFOZwc99
      
      # JWT
      - Jwt__Key=977df0f8dd4634f798c6440f74d29fb0ea5dd55eb3ea49a2c7097a98951dc515
      - Jwt__Issuer=ApexVision
      - Jwt__Audience=ApexVisionUsers
      - Jwt__ExpirationMinutes=60
      
      # CLOUDINARY
      - Cloudinary__CloudName=dqxblxx8y
      - Cloudinary__ApiKey=189848418239129
      - Cloudinary__ApiSecret=yvKKf2Q_eW1UFlu55_sLMd38XUw
      
      # RABBITMQ - Si está en contenedor local, usa "rabbitmq" como hostname
      - RABBITMQ_HOSTNAME=rabbitmq
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=Kj9#mP2$qR5@vX8&
      - RABBITMQ_VIRTUALHOST=/
      - RABBITMQ_QUEUENAME=pc_commands
      
      # ENTORNO
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      
      # LOGGING
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    
    ports:
      - "8080:8080"    # Backend API
    
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    
    networks:
      - apex-network
    
    restart: unless-stopped

  # ================================================
  # ☕ JAVA OPTIMIZATION SERVICE (Jeferson)
  # ================================================
  apex-java:
    image: jeferson/apex-java:latest
    
    container_name: apex_java
    
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=xbI4PLOvlMwRwHn7SdZXHivFOZwc99
      - JAVA_OPTS=-Xms256m -Xmx512m
    
    ports:
      - "8081:8081"    # Java API
    
    depends_on:
      - db
    
    networks:
      - apex-network
    
    restart: unless-stopped

# ================================================
# 🌐 NETWORK
# ================================================
networks:
  apex-network:
    driver: bridge

# ================================================
# 💾 VOLUMES
# ================================================
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

